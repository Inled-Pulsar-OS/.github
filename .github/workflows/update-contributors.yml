name: Weekly Contributors Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: write

jobs:
  update-contributors:
    name: update contributors
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch org contributors and generate JSON
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x .github/scripts/fetch-contributors.sh
          .github/scripts/fetch-contributors.sh Inled-Pulsar-OS jaimegh-es contributors.json

      - name: Update profile README
        run: |
          chmod +x .github/scripts/merge-contributors.sh
          .github/scripts/merge-contributors.sh profile/README.md

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/README.md contributors.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: update weekly contributors"
            git push
          fi

      - name: Notify Discord
        if: success()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -f "contributors.json" ] && [ -n "$DISCORD_WEBHOOK" ]; then
            TOTAL=$(jq -r '.totalContributors' contributors.json)
            UPDATED=$(jq -r '.lastUpdated' contributors.json)
            curl -s -X POST \
              -H "Content-Type: application/json" \
              -d '{"content":"📊 Weekly contributors update: **'"$TOTAL"'" contributors as of '"$UPDATED"'"}' \
              "$DISCORD_WEBHOOK" || true
          fi
